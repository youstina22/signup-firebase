<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Create Account | Nova</title>
    <meta name="description" content="Create your Nova account securely." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet" />

    <link rel="stylesheet" href="style.css" />

    <script type="module" src="script.js"></script>
</head>

<body>
    <main class="page">
        <section class="signup-card" aria-labelledby="signup-title">

            <a class="brand" href="#" aria-label="Nova home">
                <span class="brand-icon">N</span>
                <span>nova<span class="brand-dot">.</span></span>
            </a>

            <div class="heading">
                <p class="eyebrow">GET STARTED FOR FREE</p>
                <h1 id="signup-title">Create your account</h1>
                <p class="subtitle">
                    Join Nova and get started in just a few steps.
                </p>
            </div>

            <form id="signup-form">
                <div class="form-group">
                    <label for="email">Email address</label>
                    <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email"
                        required />
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="At least 6 characters"
                        autocomplete="new-password" minlength="6" required />
                    <p class="field-hint">
                        Use at least 6 characters, or your project's configured minimum.
                    </p>
                </div>

                <div class="form-group">
                    <label for="confirm-password">Confirm password</label>
                    <input type="password" id="confirm-password" name="confirmPassword"
                        placeholder="Re-enter your password" autocomplete="new-password" required />
                </div>

                <div id="message" class="message" role="status" aria-live="polite" hidden></div>

                <button type="submit" id="signup-button">
                    <span id="button-text">Create account</span>
                    <span id="button-spinner" class="spinner" hidden></span>
                </button>
            </form>

            <p class="footer-text">
                Already have an account?
                <a href="login.html">Sign in</a>
            </p>

            <p class="security-note">
                Your account is secured with Firebase Authentication.
            </p>
        </section>
    </main>
</body>

</html>
